name: Deploy LLM onboarding

on:
  pull_request:
    paths: ["*.py", config.yaml, requirements.txt, package.json, package-lock.json, .github/workflows/deploy.yml]
  push:
    branches: [main]
    paths: ["*.py", config.yaml, requirements.txt, package.json, package-lock.json, .github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview publish and access changes without applying them
        type: boolean
        default: true

permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot proposes updates.
jobs:
  validate:
    name: Validate config and generate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install --require-hashes -r requirements.txt
      # Validates models, products, and developer grants for each environment; no Azure calls.
      - run: |
          .venv/bin/python main.py --env dev --steps onboard product
          .venv/bin/python main.py --env prod --steps onboard product

  # Publish, grant access, and smoke test dev; prod runs only if every dev step passes.
  deploy-dev:
    name: Deploy to dev
    needs: validate
    if: github.event_name != 'pull_request'
    # Repository variable DEPLOY_RUNNER selects a runner that can reach private endpoints.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: dev
    permissions:
      id-token: write
      contents: read
    # One writer per APIM instance; later runs wait instead of publishing concurrently.
    concurrency:
      group: apim-dev
      cancel-in-progress: false
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      ALLOWED_MODEL_ENDPOINTS: ${{ vars.ALLOWED_MODEL_ENDPOINTS }}
      ACCESS_KEY_VAULT_URL: ${{ vars.ACCESS_KEY_VAULT_URL }}
      APIM_GATEWAY_URL: ${{ vars.APIM_GATEWAY_URL }}
      # Use only the OIDC login below, never a runner's own managed identity.
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
      DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m venv .venv && .venv/bin/python -m pip install --require-hashes -r requirements.txt
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: .venv/bin/python main.py --env dev $DRY_RUN_FLAG

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: apim-prod
      cancel-in-progress: false
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      ALLOWED_MODEL_ENDPOINTS: ${{ vars.ALLOWED_MODEL_ENDPOINTS }}
      ACCESS_KEY_VAULT_URL: ${{ vars.ACCESS_KEY_VAULT_URL }}
      APIM_GATEWAY_URL: ${{ vars.APIM_GATEWAY_URL }}
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
      DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A run that waited for approval must not overwrite a newer release; roll back by reverting on main.
      - name: Refuse superseded commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The token goes in environment-scoped git config, not in .git/config or on a command line.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          latest=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not the latest commit on main ($latest); not deploying to prod."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m venv .venv && .venv/bin/python -m pip install --require-hashes -r requirements.txt
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: .venv/bin/python main.py --env prod $DRY_RUN_FLAG
