name: Deploy LLM onboarding

on:
  pull_request:
    paths: ["*.py", config.yaml, requirements.txt, package.json, package-lock.json, .github/workflows/deploy.yml]
  push:
    branches: [main]
    paths: ["*.py", config.yaml, requirements.txt, package.json, package-lock.json, .github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview publish and access changes without applying them
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate config and generate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      # Validates models, products, and developer grants for each environment; no Azure calls.
      - run: |
          .venv/bin/python main.py --env dev --steps onboard product
          .venv/bin/python main.py --env prod --steps onboard product

  # Publish, grant access, and smoke test dev; prod runs only if every dev step passes.
  deploy-dev:
    name: Deploy to dev
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    # One writer per APIM instance; later runs wait instead of publishing concurrently.
    concurrency:
      group: apim-dev
      cancel-in-progress: false
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      ACCESS_KEY_VAULT_URL: ${{ vars.ACCESS_KEY_VAULT_URL }}
      DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: .venv/bin/python main.py --env dev $DRY_RUN_FLAG

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: apim-prod
      cancel-in-progress: false
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      ACCESS_KEY_VAULT_URL: ${{ vars.ACCESS_KEY_VAULT_URL }}
      DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      # A run that waited for approval must not overwrite a newer release; roll back by reverting on main.
      - name: Refuse superseded commits
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not the latest commit on main ($latest); not deploying to prod."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: .venv/bin/python main.py --env prod $DRY_RUN_FLAG
