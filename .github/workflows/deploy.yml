name: Deploy LLM onboarding

on:
  pull_request:
    paths: ["*.py", config.yaml, requirements.txt, package.json, package-lock.json]
  push:
    branches: [main]
    paths: ["*.py", config.yaml, requirements.txt, package.json, package-lock.json]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview publish and access changes without applying them
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate config and generate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - run: |
          .venv/bin/python main.py --env dev --steps onboard product
          .venv/bin/python main.py --env prod --steps onboard product

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, prod]
    environment: ${{ matrix.environment }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      ACCESS_KEY_VAULT_URL: ${{ vars.ACCESS_KEY_VAULT_URL }}
      DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: .venv/bin/python main.py --env ${{ matrix.environment }} $DRY_RUN_FLAG
