name: 3 - Publish APIM configuration

on:
  pull_request:
    paths:
      - 01-onboard-llm/**
      - 02-create-product/**
      - 03-publish/**
      - apim-artifacts/**
  push:
    branches: [main]
    paths:
      - apim-artifacts/**
      - 03-publish/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    name: Verify artifacts match the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Activity 1 - Onboard LLMs
        run: python 01-onboard-llm/onboard_llm.py

      - name: Activity 2 - Create products
        run: python 02-create-product/create_product.py

      - name: Fail if generated files were not committed
        run: |
          changes="$(git status --porcelain -- apim-artifacts 03-publish/environments)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Generated artifacts are out of date. Run the Activity 1 and 2 scripts and commit the result."
            exit 1
          fi

  dev:
    needs: verify
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_apiops-publish.yml
    with:
      environment: dev
    secrets: inherit

  prod:
    needs: dev
    uses: ./.github/workflows/_apiops-publish.yml
    with:
      environment: prod
    secrets: inherit
