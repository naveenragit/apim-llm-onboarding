name: 4 - Grant developer access

on:
  push:
    branches: [main]
    paths:
      - 04-grant-developer-access/access/**
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report planned changes without applying them
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  grant:
    name: Grant access in ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, prod]
    environment: ${{ matrix.environment }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      ACCESS_KEY_VAULT_URL: ${{ vars.ACCESS_KEY_VAULT_URL }}
      DRY_RUN_FLAG: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile access
        run: >
          python 04-grant-developer-access/grant_developer_access.py
          --grants 04-grant-developer-access/access/${{ matrix.environment }}.yaml
          $DRY_RUN_FLAG
