# Single source of truth for models, products, and developer access.
# Run `python main.py --env <environment>` after changing this file.

# Activity 1: model deployments exposed through API Management.
models:
  - name: gpt-5-mini                   # APIM name: lowercase letters, digits, hyphens -> API "llm-gpt-5-mini"
    displayName: GPT-5 mini
    description: Azure OpenAI GPT-5 mini chat completions.
    deployment: gpt-5-mini             # Deployment name on the Azure OpenAI / Foundry resource
    endpoints:                         # Model resource endpoint per environment
      dev: https://contoso-openai-dev.openai.azure.com
      prod: https://contoso-openai-prod.openai.azure.com

# Activity 2: products that bundle models with a token allowance.
products:
  - name: gpt-5-mini-standard          # Product id becomes "llm-gpt-5-mini-standard"
    displayName: GPT-5 mini Standard
    description: GPT-5 mini chat completions with a per-subscription token allowance.
    models: [gpt-5-mini]               # Model names from the models section
    approvalRequired: true             # Must stay true: portal requests need approval; the access step grants directly
    subscriptionsLimit: 1              # Subscriptions per developer
    visibleTo: [developers]            # APIM groups that can see the product in the developer portal (not guests)
    limits:                            # Per subscription, shared by its primary and secondary keys
      tokensPerMinute: 10000
      monthlyTokenQuota: 5000000
      maxTokensPerRequest: 4096        # Largest max_tokens / max_completion_tokens a request may ask for

# Activity 4: approved developer access per environment.
# Removing an entry does NOT revoke access; set state: suspended or cancelled first.
access:
  dev:
    - email: jane.doe@contoso.com
      firstName: Jane
      lastName: Doe
      product: gpt-5-mini-standard     # Product name from the products section
      # state: active                  # active (default) | suspended | cancelled
      # entraObjectId: 00000000-0000-0000-0000-000000000000   # Link to Entra ID sign-in
  prod: []
