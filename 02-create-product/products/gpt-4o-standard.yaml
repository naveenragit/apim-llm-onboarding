# One file per APIM product. A product bundles onboarded models with a usage allowance.
name: gpt-4o-standard        # APIM product id becomes "llm-<name>"
displayName: GPT-4o Standard
description: GPT-4o chat completions with a per-subscription token allowance.

models:                      # Names from 01-onboard-llm/models/*.yaml
  - gpt-4o

approvalRequired: true       # Portal requests need approval; the access pipeline grants directly
subscriptionsLimit: 1        # Subscriptions per developer
visibleTo:                   # APIM groups that can see the product in the developer portal
  - developers

limits:                      # Enforced per subscription key
  tokensPerMinute: 10000
  monthlyTokenQuota: 5000000
