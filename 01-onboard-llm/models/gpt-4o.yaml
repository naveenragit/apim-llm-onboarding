# One file per LLM deployment exposed through API Management.
name: gpt-4o                 # APIM identifier; lowercase letters, digits and hyphens
displayName: GPT-4o
description: Azure OpenAI GPT-4o chat completions.
deployment: gpt-4o           # Model deployment name on the Azure OpenAI / Foundry resource

# Model resource endpoint per environment. The first entry is the artifact default;
# every entry becomes a backend URL override for that environment's publish.
endpoints:
  dev: https://contoso-aoai-dev.openai.azure.com
  prod: https://contoso-aoai-prod.openai.azure.com
